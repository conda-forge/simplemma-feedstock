schema_version: 1

context:
  version: "2.0.0"

package:
  name: simplemma
  version: ${{ version }}

source:
  url: https://github.com/adbar/simplemma/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e16afc487549c0d80780691f8c7cfaf876bbbb071186c4a63eb7633d5d6677f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - simplemma
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A simple multilingual lemmatizer for Python.
  license: MIT
  license_file:
    - LICENSE
    - licenses/*.txt
  homepage: https://github.com/adbar/simplemma

extra:
  recipe-maintainers:
    - thewchan
